name: Playwright E2E Tests

on:
  push:
    branches: [main]

  # Allow manual runs from the GitHub Actions UI
  workflow_dispatch:

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '21.7.1'
  WORKDIR: 'Curso Learn AI Tools & Build AI Agents for Testing & QA Automation/Sección 6 Building Agentic AI for Quality Engineering using Claude Code/eventhub'

jobs:
  playwright:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Playwright tests in Docker
        run: docker compose up --build --abort-on-container-exit

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ github.run_id }}
          path: '${{ env.WORKDIR }}/playwright-report/'
          retention-days: 30
